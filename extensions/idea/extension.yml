schema_version: "1.0"

extension:
  id: "idea"
  name: "Idea to Spec Loop"
  version: "0.1.0"
  description: "Turn mixed inputs (spreadsheets, slides, notes, transcripts) into a cited spec, run traceable human feedback rounds, bind the idea to the project standards, and build a clickable prototype from the accepted spec"
  author: "Max Bollich"
  repository: "https://github.com/citymax24/idea-to-spec"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"
  tools:
    - name: python3
      required: true
    - name: markitdown
      required: false
    - name: git
      required: false

provides:
  commands:
    - name: "speckit.idea.intake"
      file: "commands/speckit.idea.intake.md"
      description: "Collect raw input files into the feature directory, convert them to Markdown and build the source inventory with stable S-IDs"
    - name: "speckit.idea.facts"
      file: "commands/speckit.idea.facts.md"
      description: "Break every source into atomic cited claims; list conflicts and open questions for the human"
    - name: "speckit.idea.draft"
      file: "commands/speckit.idea.draft.md"
      description: "Write spec.md v0.1 from the cited facts; every line carries a provenance tag"
    - name: "speckit.idea.publish"
      file: "commands/speckit.idea.publish.md"
      description: "Publish the current spec version as a private web page for reading and commenting"
    - name: "speckit.idea.feedback"
      file: "commands/speckit.idea.feedback.md"
      description: "Normalise reviewer feedback into numbered items and get confirmation before anything changes"
    - name: "speckit.idea.apply"
      file: "commands/speckit.idea.apply.md"
      description: "Apply a confirmed feedback round as one new spec version with changelog, tombstones and decision records"
    - name: "speckit.idea.accept"
      file: "commands/speckit.idea.accept.md"
      description: "Run the acceptance checklist and record the human's approval (v1.0 on first acceptance); --prototype accepts the built prototype"
    - name: "speckit.idea.standards"
      file: "commands/speckit.idea.standards.md"
      description: "Bind an idea to the project standards, check it rule by rule, record human-signed exemptions, and report drift when a standard moves"
    - name: "speckit.idea.prototype"
      file: "commands/speckit.idea.prototype.md"
      description: "Build a clickable HTML prototype from the accepted spec and publish it for review"

  templates:
    - name: "idea-inventory"
      file: "templates/inventory-template.md"
      description: "Source inventory (inputs/INVENTORY.md)"
    - name: "idea-facts"
      file: "templates/facts-template.md"
      description: "Atomic cited claims (analysis/facts.md)"
    - name: "idea-conflicts"
      file: "templates/conflicts-template.md"
      description: "Contradictions between sources (analysis/conflicts.md)"
    - name: "idea-open-questions"
      file: "templates/open-questions-template.md"
      description: "Gaps no source fills (analysis/open-questions.md)"
    - name: "idea-feedback-round"
      file: "templates/feedback-round-template.md"
      description: "One feedback round (feedback/R<n>.md)"
    - name: "idea-changelog"
      file: "templates/changelog-template.md"
      description: "Spec changelog with triggering feedback IDs (CHANGELOG.md)"
    - name: "idea-decision"
      file: "templates/decision-template.md"
      description: "Decision record for removed content (decisions/DEC-<nnn>.md)"
    - name: "idea-readiness-checklist"
      file: "templates/readiness-checklist-template.md"
      description: "Acceptance checklist (checklists/requirements.md)"
    - name: "idea-standard-yml"
      file: "templates/standard-yml-template.yml"
      description: "Skeleton for a new standards module (standards/<id>/standard.yml)"
    - name: "idea-standard-rules"
      file: "templates/standard-rules-template.md"
      description: "Skeleton for a module's rules (standards/<id>/rules.md)"
    - name: "idea-standards-bound"
      file: "templates/standards-bound-template.md"
      description: "Which standards an idea is bound to, at which version (standards/BOUND.md)"
    - name: "idea-standards-checklist"
      file: "templates/standards-checklist-template.md"
      description: "Rule-by-rule verdicts against the bound standards (checklists/standards.md)"
    - name: "idea-exemption"
      file: "templates/exemption-template.md"
      description: "Human-signed exemption from a standard rule (decisions/EXM-<nnn>.md)"
    - name: "idea-prototype-checklist"
      file: "templates/prototype-checklist-template.md"
      description: "Prototype acceptance checklist (checklists/prototype.md)"
    - name: "idea-prototype-readme"
      file: "templates/prototype-readme-template.md"
      description: "Two-lane rule for prototype feedback (prototype/README.md)"

  scripts:
    - name: "convert-inputs"
      file: "scripts/python/convert_inputs.py"
      description: "Assign S-IDs and convert raw inputs to Markdown"
      runtimes: ["python"]
    - name: "render-spec"
      file: "scripts/python/render_spec.py"
      description: "Render spec.md to a self-contained HTML page with anchors per ID"
      runtimes: ["python"]
    - name: "spec-status"
      file: "scripts/python/spec_status.py"
      description: "Exit 0 when spec.md has the expected status (used by the workflow before the prototype)"
      runtimes: ["python"]
    - name: "standards-status"
      file: "scripts/python/standards_status.py"
      description: "Compare an idea's bound standard versions against the registry and report drift; --strict exits non-zero only for law modules"
      runtimes: ["python"]

tags:
  - "standards"
  - "accessibility"
  - "prototype"
  - "ux"
  - "review"
  - "traceability"
  - "intake"
