schema_version: "1.0"
workflow:
  id: "idea-to-spec"
  name: "Idea to Spec"
  version: "0.1.0"
  author: "Max Bollich"
  description: "Mixed inputs → cited facts → spec draft bound to the project standards → human review rounds → acceptance → clickable prototype"

requires:
  speckit_version: ">=1.0.0"
  integrations:
    any:
      - "claude"

inputs:
  inbox:
    type: string
    required: true
    prompt: "Folder with the raw input files (spreadsheets, slides, notes, transcripts)"
  name:
    type: string
    required: true
    prompt: "Short name of the idea, 2-4 words, kebab-case"
  reviewer:
    type: string
    required: true
    prompt: "Name of the human reviewer (recorded on confirmations and acceptance)"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use ('auto' = the project's initialized integration)"

steps:
  - id: intake
    command: speckit.idea.intake
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.inbox }} --name {{ inputs.name }} --headless"

  - id: weights
    type: gate
    message: "Check inputs/INVENTORY.md: are the proposed source weights right? Edit the file if not, then approve. Approving confirms the weights."
    options: [approve, abort]
    on_reject: abort

  - id: facts
    command: speckit.idea.facts
    integration: "{{ inputs.integration }}"
    input:
      args: "--headless"

  - id: conflicts
    type: gate
    message: "Read analysis/conflicts.md and analysis/open-questions.md. Fill the Resolution column where you can, then approve to draft (unanswered rows become tagged assumptions)."
    options: [approve, abort]
    on_reject: abort

  - id: draft
    command: speckit.idea.draft
    integration: "{{ inputs.integration }}"
    input:
      args: "--headless"

  - id: publish
    command: speckit.idea.publish
    integration: "{{ inputs.integration }}"
    input:
      args: "--headless"

  - id: review-loop
    type: do-while
    max_iterations: 6
    condition: "{{ steps.review.output.choice == 'revise' }}"
    steps:
      - id: published-path
        type: shell
        run: "python3 -c \"import json;d=json.load(open('.specify/feature.json'))['feature_directory'];print(d+'/feedback/PUBLISHED.md',end='')\""

      - id: review
        type: gate
        message: "Read the spec (feedback/spec-review.html, or the URL in feedback/PUBLISHED.md). Write your feedback into <feature-dir>/feedback/inbox.txt in your own words, or comment on the published page. Choose 'revise' to run a feedback round, 'accept' when the spec stands."
        show_file: "{{ steps.published-path.output.stdout }}"
        options: [revise, accept]
        on_reject: skip

      - id: round
        type: if
        condition: "{{ steps.review.output.choice == 'revise' }}"
        then:
          - id: capture
            command: speckit.idea.feedback
            integration: "{{ inputs.integration }}"
            input:
              args: "--from-comments --inbox --reviewer {{ inputs.reviewer }} --headless"

          - id: latest-round
            type: shell
            run: "python3 -c \"import json,glob;d=json.load(open('.specify/feature.json'))['feature_directory'];f=sorted(glob.glob(d+'/feedback/R*.md'),key=lambda p:int(p.rsplit('/R',1)[1][:-3]));print(f[-1] if f else '',end='')\""

          - id: confirm
            type: gate
            message: "Check the normalised feedback below. Edit the round file if a line is misunderstood (Understood as / Status), then approve. Approving confirms every 'proposed' item."
            show_file: "{{ steps.latest-round.output.stdout }}"
            options: [approve, abort]
            on_reject: abort

          - id: apply
            command: speckit.idea.apply
            integration: "{{ inputs.integration }}"
            input:
              args: "--gate-confirmed {{ context.run_id }} --headless"

          - id: republish
            command: speckit.idea.publish
            integration: "{{ inputs.integration }}"
            input:
              args: "--headless"

  - id: after-review
    type: if
    condition: "{{ steps.review.output.choice == 'accept' }}"
    then:
      - id: standards-drift
        type: shell
        run: "python3 .specify/extensions/idea/scripts/python/standards_status.py --strict"
        continue_on_error: true

      - id: standards-check
        command: speckit.idea.standards
        integration: "{{ inputs.integration }}"
        input:
          args: "--check --headless"
        continue_on_error: true

      - id: accept
        command: speckit.idea.accept
        integration: "{{ inputs.integration }}"
        input:
          args: "--approved-by {{ inputs.reviewer }} --headless"

      - id: accepted-check
        type: shell
        run: "python3 .specify/extensions/idea/scripts/python/spec_status.py --expect accepted"
        continue_on_error: true

      - id: prototype-if-accepted
        type: if
        condition: "{{ steps.accepted-check.output.exit_code == 0 }}"
        then:
          - id: want-prototype
            type: gate
            message: "The spec is accepted. Choose 'prototype' to have a clickable prototype built from it, or 'done' to stop here and take spec.md into Claude Design yourself."
            options: [prototype, done]
            on_reject: skip

          - id: prototype-branch
            type: if
            condition: "{{ steps.want-prototype.output.choice == 'prototype' }}"
            then:
              - id: build
                command: speckit.idea.prototype
                integration: "{{ inputs.integration }}"
                input:
                  args: "--headless"

              - id: prototype-loop
                type: do-while
                max_iterations: 4
                condition: "{{ steps.proto-review.output.choice == 'revise' }}"
                steps:
                  - id: proto-path
                    type: shell
                    run: "python3 -c \"import json;d=json.load(open('.specify/feature.json'))['feature_directory'];print(d+'/prototype/PUBLISHED.md',end='')\""

                  - id: proto-review
                    type: gate
                    message: "Click through the prototype (prototype/prototype.html, or the URL in prototype/PUBLISHED.md). Looks stay in the prototype; anything missing, wrong or in the wrong order is a spec change. Write that into <feature-dir>/feedback/inbox.txt, or comment on the published page. Choose 'revise' to run a feedback round and rebuild, 'accept' when the prototype stands."
                    show_file: "{{ steps.proto-path.output.stdout }}"
                    options: [revise, accept]
                    on_reject: skip

                  - id: proto-round
                    type: if
                    condition: "{{ steps.proto-review.output.choice == 'revise' }}"
                    then:
                      - id: proto-capture
                        command: speckit.idea.feedback
                        integration: "{{ inputs.integration }}"
                        input:
                          args: "--from-comments --inbox --reviewer {{ inputs.reviewer }} --headless"

                      - id: proto-latest-round
                        type: shell
                        run: "python3 -c \"import json,glob;d=json.load(open('.specify/feature.json'))['feature_directory'];f=sorted(glob.glob(d+'/feedback/R*.md'),key=lambda p:int(p.rsplit('/R',1)[1][:-3]));print(f[-1] if f else '',end='')\""

                      - id: proto-confirm
                        type: gate
                        message: "Check the normalised feedback below. Edit the round file if a line is misunderstood (Understood as / Status), then approve. Approving confirms every 'proposed' item."
                        show_file: "{{ steps.proto-latest-round.output.stdout }}"
                        options: [approve, abort]
                        on_reject: abort

                      - id: proto-apply
                        command: speckit.idea.apply
                        integration: "{{ inputs.integration }}"
                        input:
                          args: "--gate-confirmed {{ context.run_id }} --headless"

                      - id: proto-republish
                        command: speckit.idea.publish
                        integration: "{{ inputs.integration }}"
                        input:
                          args: "--headless"

                      - id: proto-reaccept
                        command: speckit.idea.accept
                        integration: "{{ inputs.integration }}"
                        input:
                          args: "--approved-by {{ inputs.reviewer }} --headless"
                        continue_on_error: true

                      - id: rebuild
                        command: speckit.idea.prototype
                        integration: "{{ inputs.integration }}"
                        input:
                          args: "--draft --headless"

              - id: proto-accept-if
                type: if
                condition: "{{ steps.proto-review.output.choice == 'accept' }}"
                then:
                  - id: proto-standards-check
                    command: speckit.idea.standards
                    integration: "{{ inputs.integration }}"
                    input:
                      args: "--check --headless"
                    continue_on_error: true

                  - id: proto-accept
                    command: speckit.idea.accept
                    integration: "{{ inputs.integration }}"
                    input:
                      args: "--prototype --approved-by {{ inputs.reviewer }} --headless"
                else:
                  - id: proto-not-accepted
                    type: shell
                    run: "echo 'Prototype loop ended without acceptance (max rounds reached). Run /speckit-idea-prototype and /speckit-idea-accept --prototype interactively.'"
            else:
              - id: stopped-at-spec
                type: shell
                run: "echo 'Stopped at the accepted spec. Run /speckit-idea-prototype when you want a clickable prototype, or take spec.md into Claude Design.'"
        else:
          - id: not-ready
            type: shell
            run: "echo 'Acceptance checklist failed; see checklists/requirements.md. Fix via a feedback round, then run /speckit-idea-accept.'"
    else:
      - id: not-accepted
        type: shell
        run: "echo 'Review loop ended without acceptance (max rounds reached). Run /speckit-idea-feedback and /speckit-idea-apply interactively, then /speckit-idea-accept.'"
