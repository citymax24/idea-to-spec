<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Public Sans", "Helvetica Neue", sans-serif; }
    a { color: #7a5a1e; } a:hover { color: #574012; }
    textarea { font-family: inherit; }
    textarea:focus { outline: 2px solid #2b2620; outline-offset: 1px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #efe9dd; color: #2b2620; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 20px 18px 12px; display: flex; flex-direction: column; gap: 3px">
    <div style="font-size: 13px; color: #8b8173; display: flex; align-items: center; gap: 6px; cursor: pointer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b8173" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Offene Angebote
    </div>
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 25px; font-weight: 700; margin-top: 4px">Fam. Bergmann</div>
    <div style="font-size: 13px; color: #6b6154">A-2026-114 · 4.820 € · verschickt 21.08.</div>
    <div style="font-size: 14px; font-weight: 700; color: #a8421f; margin-top: 4px">Nachfassen seit 3 Tagen</div>
  </div>

  <div style="padding: 6px 18px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #8b8173">Status</div>
    <div style="display: flex; flex-wrap: wrap; gap: 7px">
      <sc-for list="{{stati}}" as="s" hint-placeholder-count="5">
        <div onClick="{{s.pick}}" style="font-size: 15px; font-weight: 600; padding: 13px 15px; border-radius: 4px; cursor: pointer; background: {{s.bg}}; color: {{s.fg}}; border: 1px solid {{s.bd}}">{{s.label}}</div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{istAbgesagt}}" hint-placeholder-val="{{true}}">
    <div style="padding: 16px 18px 0; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #8b8173">Absagegrund</div>
      <div style="display: flex; flex-wrap: wrap; gap: 7px">
        <sc-for list="{{gruende}}" as="g" hint-placeholder-count="4">
          <div onClick="{{g.pick}}" style="font-size: 14px; font-weight: 500; padding: 10px 13px; border-radius: 999px; cursor: pointer; background: {{g.bg}}; color: {{g.fg}}; border: 1px solid {{g.bd}}">{{g.label}}</div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <div style="padding: 16px 18px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #8b8173">Notiz</div>
    <textarea style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 3px; padding: 12px 13px; font-size: 15px; line-height: 1.45; color: #2b2620; min-height: 62px; resize: none">Will erst nach dem Urlaub entscheiden, ab 15.09. erreichbar.</textarea>
  </div>

  <div style="padding: 16px 18px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #8b8173">Angebot</div>
    <div style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 3px; padding: 13px; display: flex; align-items: center; gap: 12px; cursor: pointer">
      <div style="width: 46px; height: 58px; background: #e6ddcb; border: 1px solid #cdc3b0; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b8173" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H7a1 1 0 00-1 1v16a1 1 0 001 1h10a1 1 0 001-1V7z"/><path d="M14 3v4h4"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 14px; font-weight: 600">Angebot_Bergmann.pdf</div>
        <div style="font-size: 12px; color: #8b8173">Angehängt am 21.08.</div>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 14px 18px 24px">
    <div style="font-size: 13px; color: #6b6154; text-align: center">{{hinweis}}</div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: 'verschickt', grund: null };
  }
  renderVals() {
    const werte = ['verschickt', 'nachgefasst', 'zugesagt', 'abgesagt', 'verlaufen'];
    const gruende = ['Preis', 'Termin', 'Wettbewerber', 'sonstiges'];
    const raus = this.state.status === 'zugesagt' || this.state.status === 'abgesagt' || this.state.status === 'verlaufen';
    return {
      istAbgesagt: this.state.status === 'abgesagt',
      hinweis: raus ? 'Verlässt mit diesem Status die offene Liste.' : 'Bleibt in der offenen Liste.',
      stati: werte.map((w) => ({
        label: w,
        bg: w === this.state.status ? '#2b2620' : '#fdfbf6',
        fg: w === this.state.status ? '#efe9dd' : '#3f3830',
        bd: w === this.state.status ? '#2b2620' : '#cdc3b0',
        pick: () => this.setState({ status: w, grund: w === 'abgesagt' ? this.state.grund : null })
      })),
      gruende: gruende.map((g) => ({
        label: g,
        bg: g === this.state.grund ? '#a8421f' : '#fdfbf6',
        fg: g === this.state.grund ? '#fdfbf6' : '#5b5348',
        bd: g === this.state.grund ? '#a8421f' : '#cdc3b0',
        pick: () => this.setState({ grund: g })
      }))
    };
  }
}
</script>
</body>
</html>
