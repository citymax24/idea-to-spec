<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Public Sans", "Helvetica Neue", sans-serif; }
    a { color: #7a5a1e; } a:hover { color: #574012; }
    input { font-family: inherit; }
    input:focus { outline: 2px solid #2b2620; outline-offset: 1px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #efe9dd; color: #2b2620; display: flex; flex-direction: column">

  <div style="padding: 20px 18px 12px; display: flex; flex-direction: column; gap: 3px">
    <div style="font-size: 13px; color: #8b8173; display: flex; align-items: center; gap: 6px; cursor: pointer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b8173" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Offene Angebote
    </div>
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 25px; font-weight: 700; margin-top: 4px">Neues Angebot</div>
  </div>

  <div style="padding: 6px 18px 0; display: flex; flex-direction: column; gap: 10px">
    <div onClick="{{anhaengen}}" style="background: {{anhangBg}}; border: {{anhangBorder}}; border-radius: 4px; padding: 22px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer">
      <div style="width: 46px; height: 46px; border-radius: 3px; background: {{iconBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{iconStroke}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a1 1 0 011-1h3l1.4-2h5.2L16 5h3a1 1 0 011 1v12a1 1 0 01-1 1H5a1 1 0 01-1-1v-4"/><circle cx="12" cy="12" r="3.4"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 17px; font-weight: 700">{{anhangTitel}}</div>
        <div style="font-size: 13px; color: {{anhangHinweisFarbe}}; line-height: 1.4">{{anhangHinweis}}</div>
      </div>
    </div>
  </div>

  <div style="padding: 14px 18px 0; display: flex; flex-direction: column; gap: 11px">
    <div style="display: flex; flex-direction: column; gap: 5px">
      <div style="font-size: 13px; font-weight: 600; color: #5b5348">Kunde</div>
      <input value="{{kunde}}" onInput="{{onKunde}}" placeholder="Name des Kunden" style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 3px; padding: 14px; font-size: 16px; color: #2b2620" />
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px">
      <div style="font-size: 13px; font-weight: 600; color: #5b5348">Angebotsnummer</div>
      <input value="{{nr}}" onInput="{{onNr}}" placeholder="A-2026-000" style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 3px; padding: 14px; font-size: 16px; color: #2b2620" />
    </div>
    <div style="display: flex; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1">
        <div style="font-size: 13px; font-weight: 600; color: #5b5348">Betrag</div>
        <input value="{{betrag}}" onInput="{{onBetrag}}" placeholder="0,00 €" style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 3px; padding: 14px; font-size: 16px; color: #2b2620; width: 100%; box-sizing: border-box" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1">
        <div style="font-size: 13px; font-weight: 600; color: #5b5348">Verschickt am</div>
        <input value="{{datum}}" onInput="{{onDatum}}" placeholder="TT.MM." style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 3px; padding: 14px; font-size: 16px; color: #2b2620; width: 100%; box-sizing: border-box" />
      </div>
    </div>
  </div>

  <div style="padding: 16px 18px 0">
    <div style="background: #e6ddcb; border-radius: 3px; padding: 13px 14px; display: flex; align-items: center; gap: 9px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7a6a4a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l3.5 2"/></svg>
      <div style="font-size: 13px; color: #5b5348; line-height: 1.4">Nachfassen am <span style="font-weight: 700; color: #2b2620">{{nachfassDatum}}</span> — 7 Tage nach dem Versand</div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 14px 18px 24px">
    <div style="background: {{speichernBg}}; color: #efe9dd; text-align: center; padding: 17px; font-size: 17px; font-weight: 600; border-radius: 4px; cursor: pointer">Speichern</div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { anhang: false, kunde: '', nr: '', betrag: '', datum: '' };
  }
  renderVals() {
    const s = this.state;
    const bereit = s.anhang && s.kunde.length > 0 && s.betrag.length > 0 && s.datum.length > 0;
    return {
      kunde: s.kunde, nr: s.nr, betrag: s.betrag, datum: s.datum,
      onKunde: (e) => this.setState({ kunde: e.target.value }),
      onNr: (e) => this.setState({ nr: e.target.value }),
      onBetrag: (e) => this.setState({ betrag: e.target.value }),
      onDatum: (e) => this.setState({ datum: e.target.value }),
      anhaengen: () => this.setState({ anhang: !s.anhang }),
      anhangTitel: s.anhang ? 'Angebot_Bergmann.pdf' : 'Foto oder PDF anhängen',
      anhangHinweis: s.anhang ? 'Angehängt · zum Ersetzen tippen' : 'Abfotografieren oder Datei wählen',
      anhangHinweisFarbe: s.anhang ? '#6b6154' : '#8a6a3d',
      anhangBg: s.anhang ? '#fdfbf6' : '#f7ede2',
      anhangBorder: s.anhang ? '1px solid #cdc3b0' : '1px dashed #b3a68e',
      iconBg: s.anhang ? '#e6ddcb' : '#e8d6bf',
      iconStroke: '#7a6a4a',
      nachfassDatum: s.datum.length > 0 ? s.datum + ' + 7 Tage' : '—',
      speichernBg: bereit ? '#2b2620' : '#c3bbab'
    };
  }
}
</script>
</body>
</html>
