<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Public Sans", "Helvetica Neue", sans-serif; }
    a { color: #7a5a1e; } a:hover { color: #574012; }
    input { font-family: inherit; }
    input:focus { outline: 2px solid #2b2620; outline-offset: 1px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #efe9dd; color: #2b2620; display: flex; flex-direction: column; padding: 0 22px">

  <div style="margin-top: 150px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Anmelden</div>
    <div style="font-size: 15px; color: #6b6154; line-height: 1.45">Einmal anmelden, dann bleiben Sie auf diesem Gerät angemeldet.</div>
  </div>

  <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600; color: #5b5348">E-Mail</div>
      <input value="{{mail}}" onInput="{{onMail}}" placeholder="name@betrieb.de" style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 3px; padding: 15px 14px; font-size: 16px; color: #2b2620" />
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600; color: #5b5348">Passwort</div>
      <input type="password" value="{{pw}}" onInput="{{onPw}}" placeholder="••••••••" style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 3px; padding: 15px 14px; font-size: 16px; color: #2b2620" />
    </div>
  </div>

  <div onClick="{{anmelden}}" style="margin-top: 22px; background: {{knopfBg}}; color: {{knopfFg}}; text-align: center; padding: 18px; font-size: 17px; font-weight: 600; border-radius: 4px; cursor: pointer">{{knopfText}}</div>

  <sc-if value="{{angemeldet}}" hint-placeholder-val="{{false}}">
    <div style="margin-top: 22px; background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #8b8173">Angemeldet für</div>
      <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 19px; font-weight: 700">Grünwerk GmbH</div>
      <div style="font-size: 13px; color: #6b6154">Sie sehen alle Angebote dieses Betriebs.</div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mail: '', pw: '', angemeldet: false };
  }
  renderVals() {
    const bereit = this.state.mail.length > 0 && this.state.pw.length > 0;
    return {
      mail: this.state.mail,
      pw: this.state.pw,
      angemeldet: this.state.angemeldet,
      onMail: (e) => this.setState({ mail: e.target.value }),
      onPw: (e) => this.setState({ pw: e.target.value }),
      anmelden: () => { if (bereit) this.setState({ angemeldet: true }); },
      knopfText: this.state.angemeldet ? 'Angemeldet' : 'Anmelden',
      knopfBg: this.state.angemeldet ? '#7a8b5a' : (bereit ? '#2b2620' : '#c3bbab'),
      knopfFg: '#efe9dd'
    };
  }
}
</script>
</body>
</html>
