<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Public Sans", "Helvetica Neue", sans-serif; }
    a { color: #7a5a1e; } a:hover { color: #574012; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #efe9dd; color: #2b2620; display: flex; flex-direction: column">

  <div style="padding: 20px 18px 12px; display: flex; flex-direction: column; gap: 3px">
    <div style="font-size: 13px; color: #8b8173; display: flex; align-items: center; gap: 6px; cursor: pointer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b8173" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Offene Angebote
    </div>
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 25px; font-weight: 700; margin-top: 4px">Benutzer</div>
    <div style="font-size: 14px; color: #6b6154; line-height: 1.45">Wer hier steht, sieht alle Angebote von Grünwerk GmbH.</div>
  </div>

  <div style="padding: 10px 18px 0; display: flex; flex-direction: column; gap: 9px">
    <sc-for list="{{leute}}" as="p" hint-placeholder-count="4">
      <div style="background: #fdfbf6; border: 1px solid #cdc3b0; border-radius: 4px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; font-weight: 700">{{p.name}}</div>
          <div style="font-size: 13px; color: #8b8173">{{p.rolle}}</div>
        </div>
        <div onClick="{{p.entfernen}}" style="font-size: 14px; font-weight: 600; padding: 9px 13px; border-radius: 3px; cursor: pointer; color: {{p.knopfFg}}; border: 1px solid {{p.knopfBd}}">Entfernen</div>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{warnung}}" hint-placeholder-val="{{true}}">
    <div style="padding: 14px 18px 0">
      <div style="background: #f7ede2; border: 1px solid #d8b79a; border-radius: 4px; padding: 14px 15px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 14px; font-weight: 700; color: #8a3d10">{{warnungTitel}}</div>
        <div style="font-size: 13px; color: #6b5340; line-height: 1.45">{{warnungText}}</div>
      </div>
    </div>
  </sc-if>

  <div style="padding: 16px 18px 0">
    <div style="background: #e6ddcb; border-radius: 3px; padding: 13px 14px; font-size: 13px; color: #5b5348; line-height: 1.45">Ein entfernter Benutzer hat sofort keinen Zugang mehr. Angebote, die er erfasst hat, bleiben erhalten.</div>
  </div>

  <div style="margin-top: auto; padding: 14px 18px 24px">
    <div onClick="{{hinzufuegen}}" style="background: #2b2620; color: #efe9dd; text-align: center; padding: 17px; font-size: 17px; font-weight: 600; border-radius: 4px; cursor: pointer">Benutzer hinzufügen</div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      leute: [
        { name: 'Max Grünwerk', rolle: 'Chef' },
        { name: 'Jonas Reiter', rolle: 'Bauleiter' },
        { name: 'Timo Sandner', rolle: 'Bauleiter' },
        { name: 'Petra Grünwerk', rolle: 'Büro' }
      ],
      meldung: null,
      zaehler: 0
    };
  }
  renderVals() {
    const chefs = this.state.leute.filter((p) => p.rolle === 'Chef').length;
    const namen = ['Sara Weiland', 'Nils Brandt', 'Anke Rösch'];
    return {
      warnung: this.state.meldung !== null,
      warnungTitel: this.state.meldung ? this.state.meldung.titel : '',
      warnungText: this.state.meldung ? this.state.meldung.text : '',
      hinzufuegen: () => {
        const n = namen[this.state.zaehler % namen.length];
        this.setState({
          leute: this.state.leute.concat([{ name: n, rolle: 'Bauleiter' }]),
          zaehler: this.state.zaehler + 1,
          meldung: { titel: n + ' hinzugefügt', text: 'Die Einladung geht an die hinterlegte E-Mail-Adresse.' }
        });
      },
      leute: this.state.leute.map((p, i) => {
        const letzterChef = p.rolle === 'Chef' && chefs === 1;
        return {
          name: p.name,
          rolle: p.rolle,
          knopfFg: letzterChef ? '#b3a68e' : '#a8421f',
          knopfBd: letzterChef ? '#ddd3c0' : '#d8ab9a',
          entfernen: () => {
            if (letzterChef) {
              this.setState({ meldung: { titel: 'Nicht möglich', text: 'Der letzte Chef eines Betriebs kann nicht entfernt werden — sonst kann niemand mehr Benutzer verwalten.' } });
            } else {
              this.setState({ leute: this.state.leute.filter((x, j) => j !== i), meldung: { titel: p.name + ' entfernt', text: 'Der Zugang ist sofort gesperrt. Erfasste Angebote bleiben erhalten.' } });
            }
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
